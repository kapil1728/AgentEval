name: Bug report
description: Report a reproducible problem with AgentEval.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, do not open a public issue. Follow the private reporting guidance in `SECURITY.md`.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest set of steps and commands needed to reproduce the problem.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AgentEval version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python/Node versions, and Docker version where relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets, tokens, private task data, and personal information before posting.
      render: text
